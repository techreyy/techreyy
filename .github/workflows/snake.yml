name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # update otomatis tiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG (dark + biru, ular lime)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#D4F53C&color_dots=#0E1730,#1E3A8A,#1E4FD8,#3D7BFF,#7FB2FF

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
